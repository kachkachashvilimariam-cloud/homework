<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>style</title>
  </head>
  <body>
  <div class="card-container">
    <!-- პირველი ბარათი -->
    <article class="card card-first">
    <h2 class="card-title">ბარათი პირველი</h2>
    <img src="photo.html/profile.jpg" alt="profile" class="card-img">
    <p class="card-text">მარიამ კაჭკაჭაშვილის პორტფოლიო</p>
    <button class="card-btn">ნახვა</button>
    </article>

  <!-- მეორე ბარათი -->
    <article class="card card-second">
        <h2 class="card-title">ბარათი მეორე</h2>
        <img src="photo.html/image.jpeg" alt="image" class="card-img">
        <p class="card-text">მალხაზ სულაძის ფორტფოლიო</p>
        <button class="card-btn">ნახვა</button>
    </article>
  </div>
    </section>
  </body>
</html>
